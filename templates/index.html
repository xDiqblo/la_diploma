<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Камера АЗС - детекция объектов</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1e1e2f;
            color: #eee;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Верхняя панель с кнопками */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #2d2d3f;
            border-radius: 10px;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        .nav-btn {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3a3a55;
            color: white;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background-color: #4a4a6a;
            transform: scale(1.02);
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #ffaa44;
        }
        /* Видеоконтейнер */
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            text-align: center;
        }
        .video-container img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        /* Панель управления детекцией */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .ctrl-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background-color: #28a745;
            color: white;
        }
        .btn-start:hover {
            background-color: #218838;
            transform: scale(1.02);
        }
        .btn-stop {
            background-color: #dc3545;
            color: white;
        }
        .btn-stop:hover {
            background-color: #c82333;
            transform: scale(1.02);
        }
        /* Панель метрик */
        .metrics {
            background: #2d2d3f;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        .metrics-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 15px;
        }
        .metric-card {
            background: #1e1e2f;
            border-radius: 10px;
            padding: 10px 20px;
            text-align: center;
            min-width: 100px;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffaa44;
        }
        .metric-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
        .detection-status {
            text-align: center;
            padding: 10px;
            background: #2d2d3f;
            border-radius: 10px;
            font-size: 14px;
        }
        .status-active {
            color: #28a745;
        }
        .status-inactive {
            color: #dc3545;
        }
        /* Список объектов (детекций) */
        .detections-panel {
            background: #2d2d3f;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .detections-panel h3 {
            margin: 0 0 10px 0;
            color: #ffaa44;
        }
        .detection-item {
            padding: 8px;
            border-bottom: 1px solid #4a4a6a;
            font-family: monospace;
            font-size: 13px;
        }
        .detection-person { color: #4caf50; }
        .detection-car { color: #2196f3; }
        .detection-bus { color: #ff9800; }
        .detection-truck { color: #ff5722; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="nav-buttons">
                <button class="nav-btn" id="btn-settings">⚙️ Настройки</button>
                <button class="nav-btn" id="btn-events">📋 События</button>
            </div>
            <div class="title">📹 Камера АЗС</div>
        </div>

        <!-- Видеопоток -->
        <div class="video-container">
            <img id="video-feed" src="/video_feed" alt="Видеопоток">
        </div>

        <!-- Управление детекцией -->
        <div class="control-bar">
            <button id="btn-start-detection" class="ctrl-btn btn-start">▶ ЗАПУСТИТЬ ДЕТЕКЦИЮ</button>
            <button id="btn-stop-detection" class="ctrl-btn btn-stop">⏹ ОСТАНОВИТЬ ДЕТЕКЦИЮ</button>
        </div>

        <!-- Метрики -->
        <div class="metrics">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value" id="fps-value">0</div>
                    <div class="metric-label">FPS</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="person-count">0</div>
                    <div class="metric-label">Человек</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="car-count">0</div>
                    <div class="metric-label">Автомобили</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="bus-count">0</div>
                    <div class="metric-label">Автобусы</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="truck-count">0</div>
                    <div class="metric-label">Грузовики</div>
                </div>
            </div>
        </div>

        <!-- Статус детекции -->
        <div class="detection-status" id="detection-status-area">
            Детекция: <span id="detection-status" class="status-inactive">ОСТАНОВЛЕНА</span>
        </div>

        <!-- Список текущих детекций -->
        <div class="detections-panel">
            <h3>📊 Текущие объекты в кадре</h3>
            <div id="detections-list">
                <div style="color: #aaa;">Нет обнаруженных объектов</div>
            </div>
        </div>
    </div>

    <script>
    console.log('Скрипт загружен');

    async function updateDetections() {
        console.log('updateDetections вызвана');
        try {
            const response = await fetch('/api/detections');
            const data = await response.json();
            console.log('Данные получены:', data);

            // FPS
            const fpsSpan = document.getElementById('fps-value');
            if (fpsSpan) fpsSpan.textContent = data.fps || 0;

            // Статус детекции
            const statusSpan = document.getElementById('detection-status');
            if (statusSpan) {
                if (data.detection_enabled) {
                    statusSpan.textContent = 'АКТИВНА';
                    statusSpan.className = 'status-active';
                } else {
                    statusSpan.textContent = 'ОСТАНОВЛЕНА';
                    statusSpan.className = 'status-inactive';
                }
            }

            // Счётчики
            const counts = data.class_counts || {};
            const personSpan = document.getElementById('person-count');
            const carSpan = document.getElementById('car-count');
            const busSpan = document.getElementById('bus-count');
            const truckSpan = document.getElementById('truck-count');

            if (personSpan) personSpan.textContent = counts.person || 0;
            if (carSpan) carSpan.textContent = counts.car || 0;
            if (busSpan) busSpan.textContent = counts.bus || 0;
            if (truckSpan) truckSpan.textContent = counts.truck || 0;

            // Веса
            const weightsSpan = document.getElementById('weights-info');
            if (weightsSpan) weightsSpan.textContent = 'yolov8n';

            // Список объектов
            const objects = data.objects || [];
            const detectionsList = document.getElementById('detections-list');

            if (detectionsList) {
                if (objects.length > 0) {
                    let html = '';
                    for (const obj of objects) {
                        let colorClass = '';
                        if (obj.class === 'person') colorClass = 'detection-person';
                        else if (obj.class === 'car') colorClass = 'detection-car';
                        else if (obj.class === 'bus') colorClass = 'detection-bus';
                        else if (obj.class === 'truck') colorClass = 'detection-truck';

                        const timeStr = obj.time ? `${obj.time}s` : '—';
                        html += `<div class="detection-item">
                            <span class="${colorClass}">${obj.class}</span>
                            | ID: ${obj.track_id || '—'}
                            | время: ${timeStr}
                            | уверенность: ${obj.confidence}
                        </div>`;
                    }
                    detectionsList.innerHTML = html;
                } else {
                    detectionsList.innerHTML = '<div style="color: #aaa;">Нет обнаруженных объектов</div>';
                }
            }
        } catch (error) {
            console.error('Ошибка:', error);
            const detectionsList = document.getElementById('detections-list');
            if (detectionsList) {
                detectionsList.innerHTML = '<div style="color: red;">Ошибка подключения к серверу</div>';
            }
        }
    }

    // Кнопки
    document.getElementById('btn-start-detection')?.addEventListener('click', async () => {
        await fetch('/api/detection/start', { method: 'POST' });
        updateDetections();
    });

    document.getElementById('btn-stop-detection')?.addEventListener('click', async () => {
        await fetch('/api/detection/stop', { method: 'POST' });
        updateDetections();
    });

    document.getElementById('btn-settings')?.addEventListener('click', () => {
        alert('Страница настроек будет добавлена позже');
    });

    document.getElementById('btn-events')?.addEventListener('click', () => {
        alert('Страница событий будет добавлена позже');
    });

    // Запускаем обновление
    setInterval(updateDetections, 500);
    updateDetections();
</script>
</body>
</html>
