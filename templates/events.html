<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>События — Камера АЗС</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 20px;
            background-color: #1e1e2f; color: #eee;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 10px 20px;
            background: #2d2d3f; border-radius: 10px;
        }
        .nav-buttons { display: flex; gap: 15px; }
        .nav-btn {
            display: inline-block; padding: 10px 25px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
            background-color: #3a3a55; color: white; text-decoration: none;
            transition: all 0.2s;
        }
        .nav-btn:hover { background-color: #4a4a6a; }
        .title { font-size: 20px; font-weight: bold; color: #ffaa44; }
        .btn-danger {
            background-color: #dc3545; color: white; border: none;
            padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .btn-danger:hover { background-color: #c82333; }
        table { width: 100%; border-collapse: collapse; background: #2d2d3f; border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #4a4a6a; }
        th { background: #3a3a55; color: #ffaa44; }
        tr:hover { background: #353550; }
        .thumb { width: 120px; border-radius: 6px; cursor: pointer; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-appear { background: #2196f3; color: white; }
        .badge-long { background: #dc3545; color: white; }
        .empty { text-align: center; color: #aaa; padding: 40px; }
        a.clip-link { color: #28a745; font-weight: bold; }
        /* Модальное окно для просмотра скриншота */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100;
        }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="nav-buttons">
                <a class="nav-btn" href="/">📹 Камера</a>
                <a class="nav-btn" href="/settings">⚙️ Настройки</a>
            </div>
            <div class="title">📋 Журнал событий</div>
            <button class="btn-danger" onclick="clearEvents()">🗑 Очистить</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Время</th>
                    <th>Тип события</th>
                    <th>Объект</th>
                    <th>Уверенность</th>
                    <th>Скриншот</th>
                    <th>Видео</th>
                </tr>
            </thead>
            <tbody id="events-body">
                <tr><td colspan="7" class="empty">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно для увеличенного скриншота -->
    <div class="modal" id="modal" onclick="this.style.display='none'">
        <img id="modal-img" src="" alt="Скриншот">
    </div>

    <script>
    async function loadEvents() {
        try {
            const resp = await fetch('/api/events');
            const data = await resp.json();
            const events = data.events || [];
            const body = document.getElementById('events-body');

            if (events.length === 0) {
                body.innerHTML = '<tr><td colspan="7" class="empty">Событий пока нет</td></tr>';
                return;
            }

            let html = '';
            for (const e of events) {
                // Бейдж типа события
                const isLong = e.event_type === 'Долгое нахождение';
                const badge = `<span class="badge ${isLong ? 'badge-long' : 'badge-appear'}">${e.event_type}</span>`;

                // Скриншот
                let shot = '—';
                if (e.screenshot) {
                    const url = '/' + e.screenshot;
                    shot = `<img class="thumb" src="${url}" onclick="showModal('${url}')">`;
                }

                // Видеофрагмент
                let clip = '—';
                if (e.video_clip) {
                    clip = `<a class="clip-link" href="/${e.video_clip}" target="_blank">▶ смотреть</a>`;
                }

                const obj = e.class_name ? `${e.class_name} (ID ${e.track_id ?? '—'})` : '—';
                const conf = e.confidence != null ? e.confidence : '—';

                html += `<tr>
                    <td>${e.id}</td>
                    <td>${e.timestamp}</td>
                    <td>${badge}</td>
                    <td>${obj}</td>
                    <td>${conf}</td>
                    <td>${shot}</td>
                    <td>${clip}</td>
                </tr>`;
            }
            body.innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById('events-body').innerHTML =
                '<tr><td colspan="7" class="empty" style="color:red">Ошибка загрузки событий</td></tr>';
        }
    }

    function showModal(url) {
        document.getElementById('modal-img').src = url;
        document.getElementById('modal').style.display = 'flex';
    }

    async function clearEvents() {
        if (!confirm('Удалить все события?')) return;
        await fetch('/api/events/clear', { method: 'POST' });
        loadEvents();
    }

    // Обновляем список каждые 3 секунды
    loadEvents();
    setInterval(loadEvents, 3000);
    </script>
</body>
</html>
