<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АЗС · События</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--surf:#0e1420;--card:#131a28;--bord:#1c2840;
  --acc:#00c8ff;--acc2:#ff6020;--grn:#00e676;--red:#ff3d71;--ylw:#ffcc00;
  --txt:#b8ccec;--mut:#3a4f70;
  --font:'Rajdhani',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--font);min-height:100vh}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;background:var(--surf);border-bottom:1px solid var(--bord);
  position:sticky;top:0;z-index:100;
}
.logo{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--acc)}
.logo em{color:var(--txt);font-style:normal}
.nav{display:flex;gap:4px}
.nav a{
  padding:6px 16px;border-radius:4px;font-size:14px;font-weight:600;letter-spacing:1px;
  color:var(--mut);text-decoration:none;border:1px solid transparent;transition:.2s
}
.nav a:hover,.nav a.cur{color:var(--acc);border-color:var(--acc);background:rgba(0,200,255,.06)}
.wrap{max-width:1400px;margin:0 auto;padding:16px 20px}

/* ── фильтры ──────────────────────────────────────────── */
.filters{
  display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--bord);border-radius:6px;
  padding:14px 16px;margin-bottom:14px
}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
input[type=date],select{
  padding:7px 10px;border-radius:4px;border:1px solid var(--bord);
  background:var(--surf);color:var(--txt);font-family:var(--mono);font-size:13px;
}
input[type=date]:focus,select:focus{outline:none;border-color:var(--acc)}
.btn{
  padding:8px 18px;border:none;border-radius:4px;
  font-family:var(--font);font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s
}
.btn-filter{background:var(--acc);color:#000;align-self:flex-end}
.btn-filter:hover{box-shadow:0 0 14px rgba(0,200,255,.4)}
.btn-clear{background:rgba(255,61,113,.15);color:var(--red);border:1px solid var(--red);align-self:flex-end}
.btn-clear:hover{background:rgba(255,61,113,.25)}
.total{font-family:var(--mono);font-size:12px;color:var(--mut);align-self:flex-end;margin-left:auto}

/* ── таблица ──────────────────────────────────────────── */
.tbl-wrap{
  background:var(--card);border:1px solid var(--bord);
  border-radius:6px;overflow:hidden
}
table{width:100%;border-collapse:collapse}
th{
  padding:10px 14px;text-align:left;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);
  background:var(--surf);border-bottom:1px solid var(--bord)
}
td{
  padding:10px 14px;font-size:14px;font-weight:500;
  border-bottom:1px solid rgba(255,255,255,.03)
}
tr:last-child td{border-bottom:none}
tr.ev-row{cursor:pointer;transition:.15s}
tr.ev-row:hover{background:rgba(0,200,255,.04)}
td.ts{font-family:var(--mono);font-size:12px;color:var(--mut)}
.badge{
  padding:3px 10px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:1px
}
.b-appear{background:rgba(0,200,255,.15);color:var(--acc);border:1px solid var(--acc)}
.b-long  {background:rgba(255,61,113,.15);color:var(--red);border:1px solid var(--red)}
.thumb{
  width:100px;height:60px;object-fit:cover;border-radius:4px;
  border:1px solid var(--bord);cursor:pointer;transition:.15s
}
.thumb:hover{border-color:var(--acc);box-shadow:0 0 10px rgba(0,200,255,.3)}
a.clip{color:var(--grn);font-weight:700;text-decoration:none;font-size:13px}
a.clip:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:40px;font-size:15px}
.b-zone{background:rgba(255,204,0,.12);color:var(--ylw);border:1px solid var(--ylw)}
.zchip{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;
  font-family:var(--mono);background:var(--surf);border:1px solid var(--bord);color:var(--txt)}

/* ── отчёт по зонам ───────────────────────────────────── */
.zreport{
  background:var(--card);border:1px solid var(--bord);border-radius:6px;
  margin-bottom:14px;overflow:hidden
}
.zr-head{padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--acc);border-bottom:1px solid var(--bord)}
.zr-grid{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px}
.zr-card{flex:1;min-width:150px;background:var(--surf);border:1px solid var(--bord);
  border-radius:5px;padding:12px 14px}
.zr-name{font-weight:700;color:#fff;font-size:14px;margin-bottom:8px}
.zr-row{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:12px;color:var(--mut);padding:2px 0}
.zr-row b{color:var(--ylw)}
.zr-total{font-size:26px;font-family:var(--mono);font-weight:700;color:var(--acc);line-height:1}

/* ── пагинация ────────────────────────────────────────── */
.pagination{
  display:flex;align-items:center;justify-content:center;
  gap:8px;padding:16px;
}
.pbtn{
  padding:6px 14px;border-radius:4px;border:1px solid var(--bord);
  background:var(--surf);color:var(--txt);font-family:var(--font);
  font-size:14px;font-weight:600;cursor:pointer;transition:.2s
}
.pbtn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.pbtn:disabled{opacity:.3;cursor:default}
.pinfo{font-family:var(--mono);font-size:12px;color:var(--mut)}

/* ── модальное окно ───────────────────────────────────── */
.modal{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.88);
  align-items:center;justify-content:center;
  padding:20px
}
.modal.open{display:flex}
.mbox{
  background:var(--card);border:1px solid var(--bord);border-radius:8px;
  max-width:860px;width:100%;max-height:90vh;overflow-y:auto;
  padding:24px;position:relative
}
.mclose{
  position:absolute;top:14px;right:16px;
  width:28px;height:28px;border-radius:50%;border:none;
  background:var(--surf);color:var(--txt);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s
}
.mclose:hover{background:var(--red);color:#fff}
.mimg{width:100%;border-radius:6px;margin-top:12px;max-height:500px;object-fit:contain}
.mrow{
  display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap
}
.mtag{
  background:var(--surf);border:1px solid var(--bord);border-radius:4px;
  padding:5px 12px;font-family:var(--mono);font-size:12px
}
.mtag span{color:var(--acc);margin-left:4px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">АЗС<em> · CAM-01</em></div>
  <nav class="nav">
    <a href="/">МОНИТОР</a>
    <a href="/events" class="cur">СОБЫТИЯ</a>
    <a href="/settings">НАСТРОЙКИ</a>
  </nav>
</div>

<div class="wrap">

  <!-- Фильтры -->
  <div class="filters">
    <div class="fg">
      <label>Дата от</label>
      <input type="date" id="f_from">
    </div>
    <div class="fg">
      <label>Дата до</label>
      <input type="date" id="f_to">
    </div>
    <div class="fg">
      <label>Тип события</label>
      <select id="f_type">
        <option value="">Все</option>
        <option value="Зона: вход">Зона: вход</option>
        <option value="Зона: задержка">Зона: задержка</option>
        <option value="Зона: скопление">Зона: скопление</option>
        <option value="Появление объекта">Появление объекта</option>
        <option value="Долгое нахождение">Долгое нахождение</option>
      </select>
    </div>
    <div class="fg">
      <label>Зона</label>
      <select id="f_zone"><option value="">Все зоны</option></select>
    </div>
    <button class="btn btn-filter" onclick="load(1)">Применить</button>
    <button class="btn btn-clear"  onclick="clearAll()">🗑 Очистить</button>
    <div class="total" id="total">Событий: —</div>
  </div>

  <!-- Отдельная отчётность по зонам -->
  <div class="zreport">
    <div class="zr-head">Отчёт по зонам</div>
    <div class="zr-grid" id="zreport"><div class="empty" style="padding:16px">Загрузка…</div></div>
  </div>

  <!-- Таблица -->
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Время</th>
          <th>Тип события</th>
          <th>Зона</th>
          <th>Объект</th>
          <th>Уверенность</th>
          <th>Скриншот</th>
          <th>Видео</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="8" class="empty">Загрузка…</td></tr>
      </tbody>
    </table>

    <div class="pagination" id="pager"></div>
  </div>

</div>

<!-- Модальное окно -->
<div class="modal" id="modal">
  <div class="mbox">
    <button class="mclose" onclick="closeModal()">✕</button>
    <div id="mcontent"></div>
  </div>
</div>

<script>
let curPage=1;

function badgeFor(type){
  // выбираем цвет плашки по типу события
  if(type&&type.startsWith('Зона:')) return 'b-zone';
  if(type==='Долгое нахождение')     return 'b-long';
  return 'b-appear';
}

async function load(page=1){
  curPage=page;
  const from=document.getElementById('f_from').value;
  const to  =document.getElementById('f_to').value;
  const type=document.getElementById('f_type').value;
  const zone=document.getElementById('f_zone').value;
  const qs=new URLSearchParams({page,per_page:10,event_type:type,date_from:from,date_to:to,zone});
  const d=await(await fetch('/api/events?'+qs)).json();

  document.getElementById('total').textContent='Событий: '+d.total;
  renderTable(d.events);
  renderPager(d.total,d.page,d.per_page);
  loadZoneReport();
}

function renderTable(events){
  const tb=document.getElementById('tbody');
  if(!events.length){
    tb.innerHTML='<tr><td colspan="8" class="empty">Нет событий</td></tr>';
    return;
  }
  tb.innerHTML=events.map(e=>{
    const badge=`<span class="badge ${badgeFor(e.event_type)}">${e.event_type}</span>`;
    const zone=e.zone?`<span class="zchip">${e.zone}</span>`:'<span style="color:var(--mut)">весь кадр</span>';
    const obj=e.class_name?`${e.class_name} · ID ${e.track_id??'—'}` :'—';
    const conf=e.confidence!=null?e.confidence.toFixed(2):'—';
    const shot=e.screenshot
      ?`<img class="thumb" src="/${e.screenshot}" onclick="event.stopPropagation();showModal(${JSON.stringify(e)})">`
      :'—';
    const clip=e.video_clip
      ?`<a class="clip" href="/${e.video_clip}" target="_blank">▶ скачать</a>`
      :'—';
    return `<tr class="ev-row" onclick="showModal(${JSON.stringify(e).replace(/'/g,"&#39;")})">
      <td class="ts">${e.id}</td>
      <td class="ts">${e.timestamp}</td>
      <td>${badge}</td>
      <td>${zone}</td>
      <td>${obj}</td>
      <td class="ts">${conf}</td>
      <td>${shot}</td>
      <td>${clip}</td>
    </tr>`;
  }).join('');
}

// — отдельная отчётность по зонам —
async function loadZoneReport(){
  try{
    const from=document.getElementById('f_from').value;
    const to  =document.getElementById('f_to').value;
    const qs=new URLSearchParams({date_from:from,date_to:to});
    const d=await(await fetch('/api/events/zone_report?'+qs)).json();
    const rep=d.report||[];
    const box=document.getElementById('zreport');
    if(!rep.length){box.innerHTML='<div class="empty" style="padding:16px">Тревог пока нет</div>';return}
    box.innerHTML=rep.map(r=>`
      <div class="zr-card">
        <div class="zr-name">${r.zone}</div>
        <div class="zr-total">${r.total}</div>
        <div class="zr-row"><span>вход</span><b>${r.presence||0}</b></div>
        <div class="zr-row"><span>задержка</span><b>${r.long_stay||0}</b></div>
        <div class="zr-row"><span>скопление</span><b>${r.crowd||0}</b></div>
      </div>`).join('');
  }catch(e){console.warn(e)}
}

// — наполняем фильтр зон названиями из настроек —
async function loadZoneFilter(){
  try{
    const d=await(await fetch('/api/zones')).json();
    const sel=document.getElementById('f_zone');
    (d.zones||[]).forEach(z=>{
      const o=document.createElement('option');o.value=z.name;o.textContent=z.name;sel.appendChild(o);
    });
  }catch(e){console.warn(e)}
}

function renderPager(total,page,per){
  const pages=Math.max(1,Math.ceil(total/per));
  const p=document.getElementById('pager');
  if(pages<=1){p.innerHTML='';return;}
  p.innerHTML=`
    <button class="pbtn" onclick="load(${page-1})" ${page<=1?'disabled':''}>← Пред</button>
    <span class="pinfo">Стр. ${page} / ${pages}</span>
    <button class="pbtn" onclick="load(${page+1})" ${page>=pages?'disabled':''}>След →</button>
  `;
}

function showModal(e){
  const badge=`<span class="badge ${badgeFor(e.event_type)}">${e.event_type}</span>`;
  const img=e.screenshot?`<img class="mimg" src="/${e.screenshot}" alt="скриншот">`:'<div style="color:var(--mut);padding:20px;text-align:center">Скриншот отсутствует</div>';
  const clip=e.video_clip?`<a class="clip" href="/${e.video_clip}" target="_blank">▶ Скачать видеофрагмент</a>`:'—';
  document.getElementById('mcontent').innerHTML=`
    <div style="margin-bottom:14px;font-size:18px;font-weight:700">${badge}</div>
    <div class="mrow">
      <div class="mtag">Время<span>${e.timestamp}</span></div>
      <div class="mtag">Зона<span>${e.zone??'весь кадр'}</span></div>
      <div class="mtag">Объект<span>${e.class_name??'—'}</span></div>
      <div class="mtag">ID<span>${e.track_id??'—'}</span></div>
      <div class="mtag">Уверенность<span>${e.confidence!=null?e.confidence.toFixed(2):'—'}</span></div>
    </div>
    <div style="margin-bottom:10px">${clip}</div>
    ${img}
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

async function clearAll(){
  if(!confirm('Удалить все события?')) return;
  await fetch('/api/events/clear',{method:'POST'});
  load(1);
}

// Автообновление каждые 5 секунд
loadZoneFilter();
load(1);
setInterval(()=>load(curPage),5000);
</script>
</body>
</html>
