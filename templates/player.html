<!DOCTYPE html>
<html>
<head>
    <title>Видеоплеер АЗС</title>
    <style>
        body {
            background: #1e1e2f;
            color: white;
            font-family: monospace;
            text-align: center;
            padding: 20px;
        }
        video {
            width: 90%;
            max-width: 1000px;
            border-radius: 10px;
            background: black;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .info {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h2>📹 Камера АЗС — запись последнего часа</h2>
    <video id="videoPlayer" controls autoplay>
        <source src="/video/current" type="video/mp4">
    </video>
    <div class="controls">
        <button onclick="playLive()">🔴 Live</button>
        <button onclick="rewind(60)">⏪ -1 минута</button>
        <button onclick="rewind(300)">⏪ -5 минут</button>
        <button onclick="rewind(600)">⏪ -10 минут</button>
    </div>
    <div class="info" id="info">
        Текущее время: <span id="timeDisplay">—</span>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const timeDisplay = document.getElementById('timeDisplay');

        let isLive = true;
        let currentTimeOffset = 0;

        function playLive() {
            isLive = true;
            video.src = '/video/current';
            video.load();
            video.play();
        }

        async function rewind(secondsBack) {
            isLive = false;
            const now = Date.now() / 1000;
            const start = now - secondsBack;
            const end = now;

            // Запрашиваем сегмент
            const response = await fetch(`/video/segment?start=${start}&end=${end}`);
            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                video.src = url;
                video.load();
                video.play();
                timeDisplay.textContent = new Date(start * 1000).toLocaleTimeString();
            } else {
                alert('Не удалось загрузить видео за этот период');
            }
        }

        setInterval(() => {
            if (isLive) {
                timeDisplay.textContent = new Date().toLocaleTimeString();
            }
        }, 1000);
    </script>
</body>
</html>
